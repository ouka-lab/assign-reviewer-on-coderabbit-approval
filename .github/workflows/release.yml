name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          declared="v$(bun --print 'require("./package.json").version')"
          if [ "$TAG" != "$declared" ]; then
            echo "::error::Tag $TAG does not match package.json version $declared."
            echo "Delete the tag, bump package.json, then tag again."
            exit 1
          fi

      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

      - name: Verify generated files are current
        run: |
          bun run build
          bun run schema:generate
          if ! git diff --exit-code; then
            echo "::error::dist/ or schema.json is stale on this tag."
            exit 1
          fi

      - name: Verify the bundle is self-contained
        run: |
          while IFS= read -r module; do
            case "$module" in
              node:*|assert|buffer|child_process|crypto|events|fs|fs/promises) ;;
              http|https|net|os|path|process|stream|tls|url|util|zlib|"") ;;
              *)
                echo "::error::$module was left external to the bundle."
                exit 1
                ;;
            esac
          done < <(grep -oE '^import[[:space:]][^;]*[[:space:]]from[[:space:]]*"[^"]+"' dist/main.js \
            | sed -E 's/.*from[[:space:]]*"([^"]+)"/\1/' | sort -u)

          # --no-install matters: without it Bun silently downloads a missing
          # package from npm at run time, so an externalised dependency would
          # appear to work here while adding a network fetch to every run.
          workdir="$(mktemp -d)"
          mkdir -p "$workdir/dist"
          cp dist/main.js "$workdir/dist/main.js"
          cd "$workdir"
          if ! output="$(bun --no-install dist/main.js 2>&1)"; then
            echo "::error::Bundle failed to run without node_modules: $output"
            exit 1
          fi
          echo "$output"

      - name: Move the major version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          major="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
          echo "Moved $major to $GITHUB_SHA"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
